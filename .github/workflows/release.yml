name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build — ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_suffix: linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_suffix: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust Build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Sync App Version from Git Tag
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "Synchronizing project versions to ${VERSION} across all manifests..."
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

            const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            tauri.version = '${VERSION}';
            const signingKey = process.env.SIGNING_KEY || '';
            if (!signingKey.trim()) {
              console.error('FATAL: TAURI_SIGNING_PRIVATE_KEY is not configured or empty in GitHub Secrets. Refusing to build unsigned release artifacts.');
              process.exit(1);
            }
            console.log('SUCCESS: TAURI_SIGNING_PRIVATE_KEY detected. Signing updater artifacts.');
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2) + '\n');
          "
          sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" src-tauri/Cargo.toml

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Finnca ${{ github.ref_name }}'
          releaseBody: |
            ## Finnca ${{ github.ref_name }}

            Personal double-entry ledger notes — privacy-first, local encrypted vault, zero tracking.

            ### Linux
            - `.AppImage` — portable, tidak perlu install
            - `.deb` — untuk Ubuntu/Debian: `sudo apt install ./finnca_*.deb`
            - `.rpm` — untuk Fedora/openSUSE: `sudo dnf install ./finnca_*.rpm`

            ### Windows
            - `_x64-setup.exe` — NSIS installer (per-user, rootless)
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
